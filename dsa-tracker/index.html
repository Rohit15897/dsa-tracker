<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Progress Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .main-panel {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .sidebar {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            height: fit-content;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover {
            background: #5568d3;
        }

        button.secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        .filters {
            margin-bottom: 20px;
        }

        .filters h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .filter-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            color: #333;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .stats {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .stats h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.9em;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .status-todo {
            background: #e9ecef;
            color: #666;
        }

        .status-in-progress {
            background: #fff3cd;
            color: #856404;
        }

        .status-solved {
            background: #d4edda;
            color: #155724;
        }

        .status-revisit {
            background: #f8d7da;
            color: #721c24;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .difficulty-easy {
            background: #d4edda;
            color: #155724;
        }

        .difficulty-medium {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty-hard {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 0.8em;
            width: auto;
            border-radius: 4px;
        }

        .edit-btn {
            background: #007bff;
        }

        .edit-btn:hover {
            background: #0056b3;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-top: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #333;
            margin: 0;
        }

        .close {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
            width: auto;
            padding: 0;
        }

        .close:hover {
            color: #333;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0;
            }
            10%, 90% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 DSA Progress Tracker</h1>
            <p>Track your data structures & algorithms problem-solving journey</p>
        </header>

        <div class="content">
            <div class="main-panel">
                <div class="form-section">
                    <h2>Add New Problem</h2>
                    <form id="addProblemForm">
                        <div class="form-group">
                            <label for="problemName">Problem Name *</label>
                            <input type="text" id="problemName" placeholder="e.g., Two Sum, Merge K Lists" required>
                        </div>

                        <div class="form-group">
                            <label for="problemLink">Problem Link</label>
                            <input type="url" id="problemLink" placeholder="https://leetcode.com/...">
                        </div>

                        <div class="form-group">
                            <label for="topic">Topic *</label>
                            <select id="topic" required>
                                <option value="">Select a topic</option>
                                <option value="Arrays">Arrays</option>
                                <option value="Strings">Strings</option>
                                <option value="Trees">Trees</option>
                                <option value="Graphs">Graphs</option>
                                <option value="Linked Lists">Linked Lists</option>
                                <option value="Dynamic Programming">Dynamic Programming</option>
                                <option value="Stacks & Queues">Stacks & Queues</option>
                                <option value="Heaps">Heaps</option>
                                <option value="Hashing">Hashing</option>
                                <option value="Sorting">Sorting</option>
                                <option value="Searching">Searching</option>
                                <option value="Greedy">Greedy</option>
                                <option value="Recursion">Recursion</option>
                                <option value="Bit Manipulation">Bit Manipulation</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="difficulty">Difficulty *</label>
                            <select id="difficulty" required>
                                <option value="">Select difficulty</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="status">Status *</label>
                            <select id="status" required>
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Solved">Solved</option>
                                <option value="Revisit">Revisit</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea id="notes" placeholder="Approach, patterns used, key insights..."></textarea>
                        </div>

                        <button type="submit">Add Problem</button>
                        <button type="button" class="secondary" onclick="clearForm()">Clear</button>
                    </form>
                </div>

                <div id="successMessage" class="success-message"></div>

                <div class="filters">
                    <h3>Filter Problems</h3>
                    <div>
                        <strong style="color: #666; font-size: 0.9em;">By Difficulty:</strong>
                        <div class="filter-buttons">
                            <button class="filter-btn" onclick="filterByDifficulty('All')">All</button>
                            <button class="filter-btn" onclick="filterByDifficulty('Easy')">Easy</button>
                            <button class="filter-btn" onclick="filterByDifficulty('Medium')">Medium</button>
                            <button class="filter-btn" onclick="filterByDifficulty('Hard')">Hard</button>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <strong style="color: #666; font-size: 0.9em;">By Topic:</strong>
                        <div class="filter-buttons" id="topicFilters">
                            <button class="filter-btn" onclick="filterByTopic('All')">All</button>
                        </div>
                    </div>
                </div>

                <div id="problemsTableContainer"></div>
            </div>

            <div class="sidebar">
                <h2 style="color: #333; margin-bottom: 20px; font-size: 1.3em;">📈 Summary</h2>

                <div class="stats">
                    <h3>By Difficulty</h3>
                    <div class="stat-item">
                        <span>Easy</span>
                        <span class="stat-value" id="easyCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Medium</span>
                        <span class="stat-value" id="mediumCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Hard</span>
                        <span class="stat-value" id="hardCount">0</span>
                    </div>
                    <div class="stat-item" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #eee;">
                        <span><strong>Total</strong></span>
                        <span class="stat-value" id="totalCount">0</span>
                    </div>
                </div>

                <div class="stats">
                    <h3>By Status</h3>
                    <div class="stat-item">
                        <span>Solved</span>
                        <span class="stat-value" id="solvedCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>In Progress</span>
                        <span class="stat-value" id="inProgressCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>To Do</span>
                        <span class="stat-value" id="todoCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Revisit</span>
                        <span class="stat-value" id="revisitCount">0</span>
                    </div>
                </div>

                <div class="stats">
                    <h3>By Topic</h3>
                    <div id="topicStats"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Problem</h2>
                <button class="close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editProblemForm">
                <div class="form-group">
                    <label for="editProblemName">Problem Name *</label>
                    <input type="text" id="editProblemName" required>
                </div>

                <div class="form-group">
                    <label for="editProblemLink">Problem Link</label>
                    <input type="url" id="editProblemLink">
                </div>

                <div class="form-group">
                    <label for="editTopic">Topic *</label>
                    <select id="editTopic" required>
                        <option value="Arrays">Arrays</option>
                        <option value="Strings">Strings</option>
                        <option value="Trees">Trees</option>
                        <option value="Graphs">Graphs</option>
                        <option value="Linked Lists">Linked Lists</option>
                        <option value="Dynamic Programming">Dynamic Programming</option>
                        <option value="Stacks & Queues">Stacks & Queues</option>
                        <option value="Heaps">Heaps</option>
                        <option value="Hashing">Hashing</option>
                        <option value="Sorting">Sorting</option>
                        <option value="Searching">Searching</option>
                        <option value="Greedy">Greedy</option>
                        <option value="Recursion">Recursion</option>
                        <option value="Bit Manipulation">Bit Manipulation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editDifficulty">Difficulty *</label>
                    <select id="editDifficulty" required>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editStatus">Status *</label>
                    <select id="editStatus" required>
                        <option value="To Do">To Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Solved">Solved</option>
                        <option value="Revisit">Revisit</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editNotes">Notes</label>
                    <textarea id="editNotes"></textarea>
                </div>

                <button type="submit">Save Changes</button>
                <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        let problems = [];
        let currentFilter = { difficulty: 'All', topic: 'All' };
        let editingId = null;

        const topics = ['Arrays', 'Strings', 'Trees', 'Graphs', 'Linked Lists', 'Dynamic Programming', 'Stacks & Queues', 'Heaps', 'Hashing', 'Sorting', 'Searching', 'Greedy', 'Recursion', 'Bit Manipulation'];

        function loadProblems() {
            const saved = localStorage.getItem('dsa_problems');
            problems = saved ? JSON.parse(saved) : [];
            renderTopicFilters();
            renderProblems();
            updateStats();
        }

        function saveProblems() {
            localStorage.setItem('dsa_problems', JSON.stringify(problems));
        }

        function showSuccessMessage(message) {
            const msgEl = document.getElementById('successMessage');
            msgEl.textContent = message;
            msgEl.classList.add('show');
            setTimeout(() => msgEl.classList.remove('show'), 3000);
        }

        document.getElementById('addProblemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const problem = {
                id: Date.now(),
                name: document.getElementById('problemName').value,
                link: document.getElementById('problemLink').value,
                topic: document.getElementById('topic').value,
                difficulty: document.getElementById('difficulty').value,
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value,
                dateSolved: null
            };

            if (problem.status === 'Solved') {
                problem.dateSolved = new Date().toLocaleDateString();
            }

            problems.push(problem);
            saveProblems();
            showSuccessMessage('✓ Problem added successfully!');
            clearForm();
            renderProblems();
            updateStats();
        });

        function clearForm() {
            document.getElementById('addProblemForm').reset();
        }

        function renderTopicFilters() {
            const container = document.getElementById('topicFilters');
            container.innerHTML = '<button class="filter-btn" onclick="filterByTopic(\'All\')">All</button>';
            topics.forEach(topic => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = topic;
                btn.onclick = () => filterByTopic(topic);
                container.appendChild(btn);
            });
        }

        function filterByDifficulty(difficulty) {
            currentFilter.difficulty = difficulty;
            document.querySelectorAll('.filter-btn').forEach((btn, idx) => {
                if (idx < 4) {
                    btn.classList.toggle('active', btn.textContent === difficulty);
                }
            });
            renderProblems();
        }

        function filterByTopic(topic) {
            currentFilter.topic = topic;
            const topicBtns = document.getElementById('topicFilters').querySelectorAll('.filter-btn');
            topicBtns.forEach(btn => {
                btn.classList.toggle('active', btn.textContent === topic);
            });
            renderProblems();
        }

        function renderProblems() {
            let filtered = problems;

            if (currentFilter.difficulty !== 'All') {
                filtered = filtered.filter(p => p.difficulty === currentFilter.difficulty);
            }

            if (currentFilter.topic !== 'All') {
                filtered = filtered.filter(p => p.topic === currentFilter.topic);
            }

            const container = document.getElementById('problemsTableContainer');

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div>🎯</div>
                        <p>No problems yet. Start by adding your first problem!</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Problem</th>
                            <th>Topic</th>
                            <th>Difficulty</th>
                            <th>Status</th>
                            <th>Date Solved</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach(problem => {
                const statusClass = `status-${problem.status.toLowerCase().replace(' ', '-')}`;
                const diffClass = `difficulty-${problem.difficulty.toLowerCase()}`;

                html += `
                    <tr>
                        <td>
                            ${problem.link ? `<a href="${problem.link}" target="_blank" style="color: #667eea; text-decoration: none;">${problem.name}</a>` : problem.name}
                        </td>
                        <td>${problem.topic}</td>
                        <td><span class="difficulty-badge ${diffClass}">${problem.difficulty}</span></td>
                        <td><span class="status-badge ${statusClass}">${problem.status}</span></td>
                        <td>${problem.dateSolved || '-'}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn edit-btn" onclick="openEditModal(${problem.id})">Edit</button>
                                <button class="action-btn delete-btn" onclick="deleteProblem(${problem.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function openEditModal(id) {
            editingId = id;
            const problem = problems.find(p => p.id === id);

            document.getElementById('editProblemName').value = problem.name;
            document.getElementById('editProblemLink').value = problem.link;
            document.getElementById('editTopic').value = problem.topic;
            document.getElementById('editDifficulty').value = problem.difficulty;
            document.getElementById('editStatus').value = problem.status;
            document.getElementById('editNotes').value = problem.notes;

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingId = null;
        }

        document.getElementById('editProblemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const problem = problems.find(p => p.id === editingId);

            problem.name = document.getElementById('editProblemName').value;
            problem.link = document.getElementById('editProblemLink').value;
            problem.topic = document.getElementById('editTopic').value;
            problem.difficulty = document.getElementById('editDifficulty').value;
            problem.status = document.getElementById('editStatus').value;
            problem.notes = document.getElementById('editNotes').value;

            if (problem.status === 'Solved' && !problem.dateSolved) {
                problem.dateSolved = new Date().toLocaleDateString();
            }

            saveProblems();
            showSuccessMessage('✓ Problem updated successfully!');
            closeEditModal();
            renderProblems();
            updateStats();
        });

        function deleteProblem(id) {
            if (confirm('Are you sure you want to delete this problem?')) {
                problems = problems.filter(p => p.id !== id);
                saveProblems();
                showSuccessMessage('✓ Problem deleted!');
                renderProblems();
                updateStats();
            }
        }

        function updateStats() {
            const stats = {
                easy: problems.filter(p => p.difficulty === 'Easy').length,
                medium: problems.filter(p => p.difficulty === 'Medium').length,
                hard: problems.filter(p => p.difficulty === 'Hard').length,
                solved: problems.filter(p => p.status === 'Solved').length,
                inProgress: problems.filter(p => p.status === 'In Progress').length,
                todo: problems.filter(p => p.status === 'To Do').length,
                revisit: problems.filter(p => p.status === 'Revisit').length
            };

            document.getElementById('easyCount').textContent = stats.easy;
            document.getElementById('mediumCount').textContent = stats.medium;
            document.getElementById('hardCount').textContent = stats.hard;
            document.getElementById('totalCount').textContent = problems.length;
            document.getElementById('solvedCount').textContent = stats.solved;
            document.getElementById('inProgressCount').textContent = stats.inProgress;
            document.getElementById('todoCount').textContent = stats.todo;
            document.getElementById('revisitCount').textContent = stats.revisit;

            const topicStats = {};
            problems.forEach(p => {
                topicStats[p.topic] = (topicStats[p.topic] || 0) + 1;
            });

            const topicStatsContainer = document.getElementById('topicStats');
            topicStatsContainer.innerHTML = '';
            Object.entries(topicStats).sort((a, b) => b[1] - a[1]).forEach(([topic, count]) => {
                const div = document.createElement('div');
                div.className = 'stat-item';
                div.innerHTML = `<span>${topic}</span><span class="stat-value">${count}</span>`;
                topicStatsContainer.appendChild(div);
            });
        }

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('editModal');
            if (e.target === modal) {
                closeEditModal();
            }
        });

        loadProblems();
    </script>
</body>
